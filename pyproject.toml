[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "european-option-pricing"
version = "0.1.0"
description = "Black-Scholes and Monte Carlo pricing for European options"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = [
    "matplotlib>=3.7",
    "jupyterlab>=4",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
